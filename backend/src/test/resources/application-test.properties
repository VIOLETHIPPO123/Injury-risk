# The "test" profile: an in-memory H2 database, so tests and CI need no Supabase credentials.
spring.datasource.url=jdbc:h2:mem:sidelined;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Never called in tests: the controller tests use mock JWTs and a mocked Supabase client.
SUPABASE_URL=http://localhost:54321
SUPABASE_ANON_KEY=test-anon-key
