spring.application.name=backend

# Database credentials come from the environment variables DB_URL, DB_USERNAME and DB_PASSWORD.
# For local runs, put them in backend/.env (gitignored); see .env.example and the README.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Supabase Auth: the project URL (https://<project>.supabase.co) and its anon key (Project Settings > API).
# Like the database ones, they come from the environment or backend/.env.
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}

# Every Bearer token is checked against Supabase's public signing keys. This project signs with ES256,
# not Spring's default RS256, so the algorithm must be named. The issuer and audience checks reject
# tokens from other Supabase projects.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
